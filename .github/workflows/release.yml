name: Release

# Push tagu jako v0.1.0 (stejná verze jako v package.json) sestaví instalátory a vydá release.
# Tag s příponou (v0.2.0-beta.1) se vydá jako pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches app version
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME neodpovídá verzi $VERSION v package.json"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # electron-builder nahraje instalátory do konceptu (draft) releasu pro tento tag.
      - name: Build and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
